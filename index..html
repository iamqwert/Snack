      });
    }

    // 静音时禁用音量条显示
    const _origSetMuted = setMuted;
    setMuted = function (next) {
      _origSetMuted(next);
      if (volumeRow) volumeRow.classList.toggle("is-off", muted);
    };

    document.getElementById("moreDiffBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const pop = document.getElementById("dropdownPop");
      if (isDropdownOpen() && pop.dataset.anchor === "diff") {
        closeDropdown();
        return;
      }
      pop.dataset.anchor = "diff";
      const opts = [
        { key: "easy", label: t("diffEasy") },
        { key: "normal", label: t("diffNormal") },
        { key: "hard", label: t("diffHard") },
      ];
      openDropdown(
        e.currentTarget,
        opts.map((o) => ({
          label: o.label,
          pressed: difficulty === o.key,
          onClick: () => {
            difficulty = o.key;
            localStorage.setItem(DIFF_KEY, difficulty);
            setText(
              "moreDiffValue",
              difficulty === "easy"
                ? t("diffEasy")
                : difficulty === "hard"
                  ? t("diffHard")
                  : t("diffNormal")
            );
          },
        }))
      );
    });

    document.getElementById("moreLivesBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const pop = document.getElementById("dropdownPop");
      if (isDropdownOpen() && pop.dataset.anchor === "lives") {
        closeDropdown();
        return;
      }
      pop.dataset.anchor = "lives";
      openDropdown(
        e.currentTarget,
        [1, 2, 3, 4, 5].map((n) => ({
          label: String(n),
          pressed: startLives === n,
          onClick: () => {
            startLives = n;
            localStorage.setItem(START_LIVES_KEY, String(n));
            setText("moreLivesValue", String(n));
            // 新开一局才会用新初始生命；立刻刷新当前显示上限
            if (!running && !dead) {
              lives = startLives;
              updateLivesUI();
            }
            refreshStatsUI();
          },
        }))
      );
    });

    document.getElementById("moreThemeBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      const pop = document.getElementById("dropdownPop");
      if (isDropdownOpen() && pop.dataset.anchor === "theme") {
        closeDropdown();
        return;
      }
      pop.dataset.anchor = "theme";
      const mode = localStorage.getItem(THEME_KEY) || "system";
      openDropdown(e.currentTarget, [
        { label: t("themeLight"), pressed: mode === "light", onClick: () => applyThemeMode("light") },
        { label: t("themeDark"), pressed: mode === "dark", onClick: () => applyThemeMode("dark") },
        { label: t("themeSystem"), pressed: mode === "system", onClick: () => applyThemeMode("system") },
      ]);
    });

    document.getElementById("langCloseBtn").addEventListener("click", closeLangModal);
    document.getElementById("langModal").addEventListener("click", (e) => {
      if (e.target.id === "langModal") closeLangModal();
    });

    function openMoreModal() {
      closeDropdown();
      document.getElementById("moreModal").classList.remove("hidden");
    }
    function closeMoreModal() {
      closeDropdown();
      document.getElementById("moreModal").classList.add("hidden");
    }
    document.getElementById("moreSettingsBtn").addEventListener("click", openMoreModal);
    document.getElementById("moreCloseBtn").addEventListener("click", closeMoreModal);
    document.getElementById("moreModal").addEventListener("click", (e) => {
      if (e.target.id === "moreModal") closeMoreModal();
    });

    applyLang(langMode);
    setMuted(muted);
    refreshStatsUI();
    setOverlay(t("title"), "", t("startGame"), true, { showRules: true });

    // 首次用户手势后尝试播放开始菜单 BGM（浏览器自动播放限制）
    const unlockBgm = () => {
      ensureAudio();
      syncBgm();
      document.removeEventListener("pointerdown", unlockBgm);
    };
    document.addEventListener("pointerdown", unlockBgm);

    // 开始菜单悬停提示音
    [
      "startBtn",
      "versusBtn",
      "aiBtn",
      "startRulesBtn",
      "moreSettingsBtn",
      "homeBtn",
    ].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("mouseenter", playHover);
    });
  </script>
</body>
</html>
